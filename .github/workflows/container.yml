name: Container

# Called by release.yml so a failed image blocks the release; dispatch republishes out of band.
on:
  workflow_call:
    inputs:
      # Declared so `inputs.version` resolves when called without one; tags come from the semver ref.
      version:
        description: "Unused when called from release.yml; tags are derived from the semver git ref."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish for fgvm and fgvm-godot (e.g. 2.3.0). Builds from the selected ref and also updates :latest and :<major>.<minor>."
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image.name }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        image:
          - name: fgvm
            target: runtime
          - name: fgvm-godot
            target: runtime-godot
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Resolve Image Name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve Source Date
        id: source-date
        shell: bash
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log In To GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        env:
          FGVM_IMAGE: ${{ steps.image.outputs.name }}
          FGVM_TARGET: ${{ matrix.image.target }}
          FGVM_PLATFORMS: ${{ matrix.platform }}
          FGVM_PUSH_BY_DIGEST: 'true'
          FGVM_METADATA_FILE: ${{ runner.temp }}/metadata.json
          SOURCE_DATE_EPOCH: ${{ steps.source-date.outputs.epoch }}
        run: mise run container:build

      - name: Export Digest
        shell: bash
        run: |
          digest="$(jq -r '."containerimage.digest"' "${{ runner.temp }}/metadata.json")"
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}--${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - fgvm
          - fgvm-godot

    steps:
      - name: Download Digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}--*
          merge-multiple: true

      - name: Resolve Image Name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # On workflow_dispatch there is no semver git ref, so derive the <major>.<minor> and <major>
      # tags from the supplied version and let the raw tags below update latest/minor/major too.
      - name: Resolve Dispatch Tags
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          v="${{ inputs.version }}"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log In To GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.dispatch.outputs.minor }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.dispatch.outputs.major }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create And Push Manifest
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Inspect Manifest
        shell: bash
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"
