[tools]
dotnet = "10.0.302"
powershell = "7.5.4"

[tasks.test]
description = "Run the unit and integration suites."
dir = "."
depends = ["test:unit", "test:integration"]

# `depends` entries run in parallel, so every task below builds through this one first and then tests with
# --no-build. Without it two concurrent MSBuild graphs write Fgvm's Release output and race on fgvm-core.deps.json.
[tasks."test:build"]
description = "Build every project once so the parallel test tasks never race on shared build output."
dir = "."
run = "dotnet build --nologo --configuration Release Fgvm.slnx"

[tasks."test:unit"]
description = "Run the faster unit tests only."
dir = "."
depends = ["test:build"]
run = "dotnet test --nologo --no-build --configuration Release Fgvm.Tests/Fgvm.Tests.csproj"

[tasks."test:integration"]
description = "Run only the integration tests."
dir = "."
depends = ["integration:prepare"]
run = "dotnet test --nologo --no-build --configuration Release Fgvm.Tests.Integration/Fgvm.Tests.Integration.csproj"

[tasks."integration:prepare"]
description = "Publish the CLI used by integration tests."
dir = "."
depends = ["test:build"]
run = "dotnet run Fgvm.Tests.Integration/Fixtures/PublishCli.cs"

[tasks."e2e:prepare"]
description = "Build fixtures and publish the CLI used by black-box e2e tests."
dir = "."
sources = [
    "Fgvm/**/*.cs",
    "Fgvm.Cli/**/*.cs",
    "Fgvm/Fgvm.csproj",
    "Fgvm.Cli/Fgvm.Cli.csproj",
    "e2e/fixtures/*.cs",
    "e2e/fixtures/*.json",
    "Fgvm.Tests.Integration/Fixtures/PublishCli.cs",
    "Fgvm.slnx",
    "global.json"
]
outputs = { auto = true }
run = [
    "dotnet run e2e/fixtures/BuildFixtures.cs",
    "dotnet run Fgvm.Tests.Integration/Fixtures/PublishCli.cs --output e2e/.cli"
]

[tasks."test:e2e"]
description = "Run black-box e2e tests."
dir = "."
depends = ["e2e:prepare"]
run = "pwsh -NoLogo -NoProfile -File e2e/run.ps1 -Parallel"

[tasks."test:e2e:detailed"]
description = "Run black-box e2e tests with per-test output."
dir = "."
depends = ["e2e:prepare"]
run = "pwsh -NoLogo -NoProfile -File e2e/run.ps1 -Parallel -Verbosity Detailed"

[tasks.format]
description = "Format the project with JetBrains cleanupcode."
dir = "."
run = [
    "dotnet tool run jb -- cleanupcode Fgvm.slnx --profile=Cleanup --no-build"
]

[tasks."format:check"]
description = "Verify JetBrains cleanupcode formatting in a clean worktree."
dir = "."
depends = ["format"]
run = [
    "git diff --quiet",
    "git diff --cached --quiet",
    "git diff --exit-code"
]

[tasks.build]
description = "Build the release configuration of the CLI."
dir = "."
run = "dotnet build --nologo --configuration Release Fgvm.Cli/Fgvm.Cli.csproj"

[tasks."container:build"]
description = "Build an fgvm container image. Loads fgvm:local (the standard `runtime` target) by default; env vars configure target/image/tags/platforms/push for CI."
dir = "."
run = '''
image="${FGVM_IMAGE:-fgvm}"
tags="${FGVM_TAGS:-$image:local}"
target="${FGVM_TARGET:-runtime}"
epoch="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"

set -- --target "$target" --build-arg SOURCE_DATE_EPOCH="$epoch" --provenance=false --sbom=false

[ -n "${FGVM_PLATFORMS:-}" ] && set -- "$@" --platform "$FGVM_PLATFORMS"

if [ "${FGVM_PUSH_BY_DIGEST:-false}" = "true" ]; then
  set -- "$@" --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true"
  [ -n "${FGVM_METADATA_FILE:-}" ] && set -- "$@" --metadata-file "$FGVM_METADATA_FILE"
else
  for tag in $tags; do
    set -- "$@" --tag "$tag"
  done
  if [ "${FGVM_PUSH:-false}" = "true" ]; then
    set -- "$@" --push
  elif [ "${FGVM_LOAD:-true}" = "true" ]; then
    set -- "$@" --load
  fi
fi

[ -n "${FGVM_CACHE_FROM:-}" ] && set -- "$@" --cache-from "$FGVM_CACHE_FROM"
[ -n "${FGVM_CACHE_TO:-}" ] && set -- "$@" --cache-to "$FGVM_CACHE_TO"

docker buildx build "$@" .
'''

[tasks."container:build:fgvm"]
description = "Build the standard slim fgvm container image. Loads fgvm:local by default."
dir = "."
run = '''
FGVM_TARGET=runtime \
FGVM_IMAGE="${FGVM_IMAGE:-fgvm}" \
FGVM_TAGS="${FGVM_TAGS:-fgvm:local}" \
mise run container:build
'''

[tasks."container:build:fgvm-godot"]
description = "Build the full fgvm-godot container image. Loads fgvm-godot:local by default."
dir = "."
run = '''
FGVM_TARGET=runtime-godot \
FGVM_IMAGE="${FGVM_IMAGE:-fgvm-godot}" \
FGVM_TAGS="${FGVM_TAGS:-fgvm-godot:local}" \
mise run container:build
'''

[tasks."build:solution"]
description = "Build all projects in release configuration."
dir = "."
run = "dotnet build --nologo --configuration Release"

[tasks."build:analyze"]
description = "Build all projects with Roslyn analyzers enabled and logging template diagnostics as errors."
dir = "."
run = "dotnet build --nologo --no-incremental --configuration Release Fgvm.slnx /p:RunAnalyzersDuringBuild=true /p:EnableNETAnalyzers=true /p:AnalysisLevel=latest-recommended -warnaserror:CA2254"

[tasks."build:analyze:priority"]
description = "Fail the build on the curated high-value analyzer rules (perf/correctness), with naming and logging-perf noise suppressed so the output is just the punch list."
dir = "."
run = "dotnet build --nologo --no-incremental --configuration Release Fgvm.slnx /p:RunAnalyzersDuringBuild=true /p:EnableNETAnalyzers=true /p:AnalysisLevel=latest-recommended '/p:NoWarn=CA1707%3BCA1716%3BCA1711%3BCA1715%3BCA1708%3BCA1805%3BCA1036%3BCA1001%3BCA1873%3BCA1848' -warnaserror:CA1822,CA1861,CA1865,CA1859,CA1850,CA1806,CA2201,CA1310,CA1309,CA1305,CA1311,CA1304"

[tasks.restore]
description = "Restore all NuGet packages."
dir = "."
run = "dotnet restore"

[tasks.clean]
description = "Clean all build artifacts."
dir = "."
run = "dotnet clean"

[tasks.publish]
description = "Publish the CLI (Release configuration, default RID)."
dir = "."
run = "dotnet publish Fgvm.Cli/Fgvm.Cli.csproj -c Release -o ./.bin"

[tasks."local:run"]
description = "Publish and run the Release configuration."
run = "./.bin/fgvm"
depends = ["publish"]

[tasks."local:container"]
description = "Build and run the local standard fgvm container image."
dir = "."
depends = ["container:build:fgvm"]
run = "docker run --rm fgvm:local"

[tasks."container:build:full"]
description = "Alias for container:build:fgvm-godot."
dir = "."
run = "mise run container:build:fgvm-godot"

[tasks."local:container:full"]
description = "Alias for local:container:fgvm-godot."
dir = "."
depends = ["local:container:fgvm-godot"]
run = "true"

[tasks."local:container:fgvm-godot"]
description = "Build and run the local full fgvm-godot container image."
dir = "."
depends = ["container:build:fgvm-godot"]
run = "docker run --rm fgvm-godot:local --version"

[tasks."container:publish"]
description = "Push the standard fgvm image for FGVM_TAGS to a registry (host arch unless FGVM_PLATFORMS is set). Requires docker login."
dir = "."
run = '''
FGVM_TARGET=runtime \
FGVM_IMAGE="${FGVM_IMAGE:-fgvm}" \
FGVM_TAGS="${FGVM_TAGS:-fgvm:local}" \
FGVM_PUSH=true \
FGVM_LOAD=false \
mise run container:build
'''

[tasks."container:publish:fgvm-godot"]
description = "Push the full fgvm-godot image for FGVM_TAGS to a registry (host arch unless FGVM_PLATFORMS is set). Requires docker login."
dir = "."
run = '''
FGVM_TARGET=runtime-godot \
FGVM_IMAGE="${FGVM_IMAGE:-fgvm-godot}" \
FGVM_TAGS="${FGVM_TAGS:-fgvm-godot:local}" \
FGVM_PUSH=true \
FGVM_LOAD=false \
mise run container:build
'''

[tasks.versionize]
description = "Update versions and changelog using Versionize."
dir = "."
run = "dotnet tool run versionize"

[tasks."versionize:dry-run"]
description = "Preview the changes Versionize would make."
dir = "."
run = "dotnet tool run versionize --dry-run"

[tasks."preview:dryrun"]
description = "Show the version, tag, and artifacts for a preview release."
depends = [{ task = "preview:_run", env = { FGVM_PREVIEW_PUBLISH = "false" } }]

[tasks."preview:publish"]
description = "Dispatch an owner-only GitHub Actions preview release."
depends = [{ task = "preview:_run", env = { FGVM_PREVIEW_PUBLISH = "true" } }]

[tasks."preview:_run"]
hide = true
dir = "."
shell = "pwsh -NoLogo -NoProfile -Command"
run = '''
$ErrorActionPreference = "Stop"
Set-StrictMode -Version Latest

$publish = $env:FGVM_PREVIEW_PUBLISH -eq "true"
$repositoryRoot = if ($env:MISE_PROJECT_ROOT) {
    $env:MISE_PROJECT_ROOT
} else {
    (Get-Location).Path
}
$originalLocation = Get-Location
Set-Location $repositoryRoot

try {
    if ($publish) {
        $worktreeStatus = & git status --porcelain
        if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the Git worktree."
        }

        if ($worktreeStatus) {
            throw "Preview releases must be published from a clean worktree. Commit or stash the current changes first."
        }
    }

    & mise x -- dotnet tool restore
    if ($LASTEXITCODE -ne 0) {
        throw "Unable to restore the .NET tools."
    }

    $versionizeOutput = @(& mise x -- dotnet tool run versionize -- --dry-run --skip-dirty --exit-insignificant-commits 2>&1)
    if ($LASTEXITCODE -ne 0) {
        $versionizeOutput | Out-Host
        throw "Versionize could not determine a preview version."
    }

    $versionizeOutput | Out-Host
    $versionMatch = [regex]::Match(
        ($versionizeOutput -join "`n"),
        "bumping version from \S+ to (?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?) in projects")
    if (!$versionMatch.Success) {
        throw "Could not determine the next version from Versionize output."
    }

    $nextVersion = $versionMatch.Groups["version"].Value
    $timestamp = [DateTimeOffset]::UtcNow.ToString(
        "yyyyMMddHHmmss",
        [Globalization.CultureInfo]::InvariantCulture)
    $tag = "preview-$nextVersion-$timestamp"
    $buildVersion = "$nextVersion-preview.$timestamp"
    $commit = (& git rev-parse HEAD).Trim()
    if ($LASTEXITCODE -ne 0) {
        throw "Unable to resolve the current Git commit."
    }

    $branch = (& git branch --show-current).Trim()
    if ($LASTEXITCODE -ne 0) {
        throw "Unable to resolve the current Git branch."
    }

    Write-Host ""
    Write-Host "Preview plan"
    Write-Host "  Next version:  $nextVersion"
    Write-Host "  Build version: $buildVersion"
    Write-Host "  Tag:           $tag"
    Write-Host "  Commit:        $commit"
    Write-Host "  Workflow ref:  $branch"
    Write-Host "  Artifacts:     linux-x64, linux-arm64, win-x64, osx-x64, osx-arm64"

    if (!$publish) {
        if (& git status --porcelain) {
            Write-Warning "Uncommitted changes are not included in Versionize's next-version calculation."
        }

        Write-Host ""
        Write-Host "Dry run only. Run 'mise run preview:publish' to publish this commit."
        return
    }

    if (!(Get-Command gh -ErrorAction SilentlyContinue)) {
        throw "GitHub CLI (gh) is required to publish a preview."
    }

    if (!$branch) {
        throw "Preview releases cannot be dispatched from a detached HEAD. Check out a branch first."
    }

    & gh auth status
    if ($LASTEXITCODE -ne 0) {
        throw "GitHub CLI is not authenticated. Run 'gh auth login' first."
    }

    $remoteBranch = @(& git ls-remote origin "refs/heads/$branch")
    if ($LASTEXITCODE -ne 0) {
        throw "Unable to inspect origin/$branch."
    }

    $remoteCommit = if ($remoteBranch.Count -gt 0) {
        ($remoteBranch[0] -split "\s+")[0]
    } else {
        ""
    }

    if ($remoteCommit -ne $commit) {
        throw "origin/$branch does not point to $commit. Push the current commit before publishing a preview."
    }

    # Set FGVM_SKIP_CONTAINER_CHECK=1 to bypass container builds.
    if ($env:FGVM_SKIP_CONTAINER_CHECK -eq "1") {
        Write-Warning "Skipping the fgvm-godot container check because FGVM_SKIP_CONTAINER_CHECK=1."
    } else {
        Write-Host ""
        Write-Host "Verifying the fgvm-godot container image builds..."
        & mise run container:build:fgvm-godot
        if ($LASTEXITCODE -ne 0) {
            throw "The fgvm-godot container image failed to build. Fix it before publishing a preview."
        }
    }

    & gh workflow run preview.yml `
        --ref $branch `
        --raw-field "commit=$commit" `
        --raw-field "version=$nextVersion" `
        --raw-field "timestamp=$timestamp"
    if ($LASTEXITCODE -ne 0) {
        throw "Dispatching the preview workflow failed."
    }

    Write-Host ""
    Write-Host "Dispatched $tag. Follow it with 'gh run watch'."
}
catch {
    [Console]::Error.WriteLine("Preview failed: $($_.Exception.Message)")
    exit 1
}
finally {
    Set-Location $originalLocation
}
'''

[tasks."preview:_build"]
hide = true
dir = "."
shell = "pwsh -NoLogo -NoProfile -Command"
run = '''
$ErrorActionPreference = "Stop"
Set-StrictMode -Version Latest

$rid = $env:FGVM_PREVIEW_RID
$version = $env:FGVM_PREVIEW_VERSION
if (!$rid) {
    throw "FGVM_PREVIEW_RID is required."
}
if (!$version) {
    throw "FGVM_PREVIEW_VERSION is required."
}

$previewRoot = Join-Path ".gdvm-publish" $version
$publishDirectory = Join-Path $previewRoot "publish/$rid"
$artifactDirectory = Join-Path $previewRoot "artifacts"
$executableName = $rid.StartsWith("win-", [StringComparison]::OrdinalIgnoreCase) ? "fgvm.exe" : "fgvm"
$executablePath = Join-Path $publishDirectory $executableName

& mise x -- dotnet publish Fgvm.Cli/Fgvm.Cli.csproj `
    --configuration Release `
    --runtime $rid `
    --output $publishDirectory `
    "-p:Version=$version"
if ($LASTEXITCODE -ne 0) {
    throw "Publishing fgvm for $rid failed."
}

$packageScript = Join-Path $env:MISE_PROJECT_ROOT "scripts/package-release.ps1"
& $packageScript `
    -Rid $rid `
    -Source $executablePath `
    -OutputDirectory $artifactDirectory
'''
